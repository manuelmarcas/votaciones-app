<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Votaciones</title>
<meta name="description" content="Crea votaciones de horas, días, semanas o meses y compártelas con tu grupo.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗳️</text></svg>">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="demo-banner" class="demo-banner" hidden>
  <strong>Modo demo:</strong> los datos se guardan solo en este navegador. Abre otra pestaña y entra con otro nombre para simular a otra persona.
  <a id="demo-exit" href="./">Salir del modo demo</a>
</div>

<div id="boot" class="boot">Cargando…</div>

<div id="gate" hidden>
  <div class="gate-card">
    <div class="gate-emoji">🗳️</div>
    <h1>Votaciones</h1>
    <p id="gate-text"></p>
    <button class="google-btn" id="login" hidden>
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.1 8 3l5.7-5.7C34.5 6 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 19 13 24 13c3.1 0 5.9 1.1 8 3l5.7-5.7C34.5 6 29.5 4 24 4c-7.7 0-14.4 4.4-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.8 13.6-4.8l-6.3-5.3c-2.1 1.4-4.8 2.3-7.3 2.3-5.3 0-9.7-3.1-11.3-7.5l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.3 5.7l6.3 5.3C40.9 36.5 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
      Entrar con Google
    </button>
    <form id="demo-login" hidden>
      <input id="demo-name" class="input" maxlength="40" placeholder="Tu nombre" autocomplete="off" required>
      <button class="btn primary" type="submit">Entrar</button>
    </form>
    <div id="gate-status" role="alert"></div>
  </div>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-left">
      <button class="sb-toggle" id="sb-toggle" aria-label="Abrir mis votaciones" aria-controls="sidebar" aria-expanded="false">☰</button>
      <a class="brand" href="#/">🗳️ Votaciones</a>
    </div>
    <div class="who">
      <a class="me" href="#/perfil" title="Tu perfil">
        <span id="me-avatar" class="me-avatar"></span>
        <span id="who-name"></span>
      </a>
      <button class="logout-btn" id="logout">Salir</button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Mis votaciones"></aside>
    <main id="view"></main>
  </div>
  <div class="sb-backdrop" id="sb-backdrop"></div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
